name: Build

on:
  push:
    branches: [main]
    paths:
      - "**/*.scad"
      - "**/*.plantuml"
      - "**/*.puml"
      - "**/*.asciidoc"
      - "**/*.adoc"
      - "**/*.kicad_pcb"
      - "**/*.kicad_sch"
      - "**/*.kicad_pro"
      - "**/kibot.yaml"
      - "**/*.cir"
      - "containers/**"
      - "results/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  DEBUG: true
  IMG_SCAD: ghcr.io/donnels/openscad:main
  IMG_PUML: ghcr.io/donnels/plantuml:main
  IMG_ADOC: ghcr.io/donnels/asciidoc:main
  IMG_KICAD: ghcr.io/inti-cmnb/kicad_auto:ki8
  IMG_KICAD3D: ghcr.io/inti-cmnb/kicad_auto:ki9

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Render KiCad
        run: |
          mkdir -p results/kicad results/cad
          docker run --rm -v "$PWD":/w -w /w/kicad "$IMG_KICAD" \
            kicad-cli sch export pdf -o /w/results/kicad/pb3-replacement-schematic.pdf pb3-replacement.kicad_sch
          docker run --rm -v "$PWD":/w -w /w/kicad "$IMG_KICAD" \
            kicad-cli sch export svg -o /w/results/kicad pb3-replacement.kicad_sch
          mv results/kicad/pb3-replacement.svg results/kicad/pb3-replacement-schematic.svg
          [[ "$DEBUG" == "true" ]] && echo "=== Finding KiCad projects with kibot.yaml ==="
          [[ "$DEBUG" == "true" ]] && find . -name "kibot.yaml"
          for cfg in $(find . -name "kibot.yaml"); do
            dir=$(dirname "$cfg")
            [[ "$DEBUG" == "true" ]] && echo "Rendering KiCad project in: $dir"
            docker run --rm -v "$PWD":/w -w "/w/$dir" "$IMG_KICAD" \
              kibot -c kibot.yaml -d /w/results/kicad -s all
          done
          [[ "$DEBUG" == "true" ]] && echo "=== Generated KiCad outputs ==="
          [[ "$DEBUG" == "true" ]] && find . -name "kibot_errors.filter" -o -name "*.pdf" -o -name "*.svg" | grep -v docs/
      - name: Render KiCad 3D (STEP, GLB, photorealistic renders)
        run: |
          mkdir -p results/kicad results/cad
          docker run --rm -v "$PWD":/w -w /w/kicad "$IMG_KICAD3D" \
            kicad-cli pcb export step -o /w/results/kicad/pb3-replacement.step pb3-replacement.kicad_pcb
          docker run --rm -v "$PWD":/w -w /w/kicad "$IMG_KICAD3D" \
            kicad-cli pcb export glb -o /w/results/kicad/pb3-replacement.glb pb3-replacement.kicad_pcb
          docker run --rm -v "$PWD":/w -w /w/kicad "$IMG_KICAD3D" \
            kicad-cli pcb render --output /w/results/kicad/pb3-replacement-render-top.png \
              --quality high --side top --width 1200 --height 900 pb3-replacement.kicad_pcb
          docker run --rm -v "$PWD":/w -w /w/kicad "$IMG_KICAD3D" \
            kicad-cli pcb render --output /w/results/kicad/pb3-replacement-render-iso.png \
              --quality high --side top --perspective --rotate 25,0,135 --floor \
              --width 1200 --height 900 pb3-replacement.kicad_pcb
          [[ "$DEBUG" == "true" ]] && echo "=== Generated KiCad 3D outputs ==="
          [[ "$DEBUG" == "true" ]] && ls -lh results/kicad/pb3-replacement.step results/kicad/pb3-replacement.glb results/kicad/pb3-replacement-render-*.png
      - name: Convert board GLB to STL for OpenSCAD fit-check
        run: |
          pip install --quiet trimesh
          python3 - << 'PYEOF'
          import numpy as np
          import trimesh

          mesh = trimesh.load("results/kicad/pb3-replacement.glb")
          board = trimesh.util.concatenate(list(mesh.geometry.values()))
          board.apply_scale(1000.0)  # metres (glTF) -> millimetres (OpenSCAD)
          board.apply_transform(
              trimesh.transformations.rotation_matrix(np.radians(-90), [1, 0, 0])
          )  # glTF Y-up -> OpenSCAD Z-up
          board.apply_translation(-board.bounds[0])  # origin-align at [0,0,0]
          board.export("results/cad/pb3-replacement-board.stl")
          print("board bounds (mm):", board.bounds.tolist())
          PYEOF
      - name: Render OpenSCAD
        run: |
          mkdir -p results/cad
          [[ "$DEBUG" == "true" ]] && echo "=== Finding .scad files ==="
          [[ "$DEBUG" == "true" ]] && find . -name "*.scad" ! -name "include-*.scad"
          for f in $(find . -name "*.scad" ! -name "include-*.scad"); do
            dir=$(dirname "$f")
            base=$(basename "$f" .scad)
            [[ "$DEBUG" == "true" ]] && echo "Rendering: $f -> ${dir}/${base}.{stl,png}"
            docker run --rm -v "$PWD":/w "$IMG_SCAD" \
              openscad -o "/w/results/cad/${base}.stl" "/w/$f" &
            docker run --rm -v "$PWD":/w "$IMG_SCAD" \
              openscad --imgsize 1600,1200 --colorscheme Tomorrow \
              -o "/w/results/cad/${base}.png" "/w/$f" &
            wait
          done
          [[ "$DEBUG" == "true" ]] && echo "=== Generated OpenSCAD files ==="
          [[ "$DEBUG" == "true" ]] && find . -name "*.stl" -o -name "*.png" | grep -E '\.(stl|png)$'
      - name: Render PlantUML
        run: |
          mkdir -p results/diagrams
          [[ "$DEBUG" == "true" ]] && echo "=== Finding .plantuml/.puml files ==="
          [[ "$DEBUG" == "true" ]] && find . -name "*.plantuml" -o -name "*.puml"
          for f in $(find . -name "*.plantuml" -o -name "*.puml"); do
            dir=$(dirname "$f")
            [[ "$DEBUG" == "true" ]] && echo "Rendering: $f -> ${dir}/{svg,png}"
            docker run --rm -v "$PWD":/w "$IMG_PUML" \
              plantuml -tsvg -o "/w/results/diagrams" "/w/$f"
            docker run --rm -v "$PWD":/w "$IMG_PUML" \
              plantuml -tpng -o "/w/results/diagrams" "/w/$f"
          done
          [[ "$DEBUG" == "true" ]] && echo "=== Generated PlantUML files ==="
          [[ "$DEBUG" == "true" ]] && find . \( -name "*.svg" -o -name "*.png" \) ! -path "./docs/*"
      - name: Run circuit simulation
        run: |
          mkdir -p results/circuit
          docker build -t aiwa-pb3-ngspice containers/ngspice
          docker run --rm \
            -v "$PWD/kicad":/work:ro \
            -v "$PWD/results/circuit":/results \
            aiwa-pb3-ngspice \
            -b -o /results/pb3-replacement.log /work/pb3-replacement.cir
          grep -E 'vout_|load_current|vbat' results/circuit/pb3-replacement.log
      - name: Build AsciiDoc
        run: |
          mkdir -p results/docs
          [[ "$DEBUG" == "true" ]] && echo "=== Finding .asciidoc files ==="
          [[ "$DEBUG" == "true" ]] && find . -name '*.asciidoc'
          for f in $(find . -name '*.asciidoc'); do
            base=$(basename "$f" .asciidoc)
            [[ "$DEBUG" == "true" ]] && echo "Building: $f -> results/docs/${base}.{html,pdf}"
            docker run --rm -v "$PWD":/w "$IMG_ADOC" \
              asciidoctor -r asciidoctor-diagram -o "/w/results/docs/${base}.html" "/w/$f"
            docker run --rm -v "$PWD":/w "$IMG_ADOC" \
              asciidoctor-pdf -r asciidoctor-diagram -o "/w/results/docs/${base}.pdf" "/w/$f"
          done
          [[ "$DEBUG" == "true" ]] && echo "=== Generated docs ==="
          [[ "$DEBUG" == "true" ]] && ls -lh results/docs/
      - name: Commit all outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [[ "$DEBUG" == "true" ]] && echo "=== Adding all generated files ==="
          git add results/
          find kicad-hello-world -name "*.pdf" -o -name "*.svg" -o -name "*.txt" -o -name "*.pos" | xargs -r git add
          [[ "$DEBUG" == "true" ]] && echo "=== Git status ==="
          [[ "$DEBUG" == "true" ]] && git status
          git diff --cached --quiet || (git commit -m "ci: render all outputs [skip ci]" && git push)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: results/docs

  deploy:
    runs-on: ubuntu-latest
    needs: render
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
